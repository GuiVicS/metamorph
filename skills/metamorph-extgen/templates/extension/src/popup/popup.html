<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__EXTENSION_NAME__</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .container { padding: 16px; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .icon { width: 32px; height: 32px; background: #1a73e8; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; }
    .title { font-size: 16px; font-weight: 600; }
    .status { display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
    .status.connected { background: #e8f0fe; color: #1a73e8; }
    .status.disconnected { background: #fce8e6; color: #d93025; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status.connected .status-dot { background: #1a73e8; }
    .status.disconnected .status-dot { background: #d93025; }
    .info { font-size: 12px; color: #666; margin-bottom: 8px; }
    .capabilities { max-height: 200px; overflow-y: auto; }
    .capability { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 13px; }
    .capability:last-child { border-bottom: none; }
    .cap-name { color: #333; }
    .cap-status { font-size: 11px; padding: 2px 6px; border-radius: 4px; }
    .cap-status.ok { background: #e8f0fe; color: #1a73e8; }
    .cap-status.error { background: #fce8e6; color: #d93025; }
    .cap-status.unsupported { background: #f1f3f4; color: #5f6368; }
    .footer { margin-top: 16px; padding-top: 12px; border-top: 1px solid #eee; text-align: center; font-size: 11px; color: #999; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
      </div>
      <div class="title">__EXTENSION_NAME__</div>
    </div>

    <div class="status disconnected" id="statusEl">
      <div class="status-dot"></div>
      <span id="statusText">Disconnected</span>
    </div>

    <div class="info" id="fingerprintInfo">No fingerprint loaded</div>

    <div class="capabilities" id="capabilitiesList">
      <div style="color: #999; font-size: 12px; text-align: center; padding: 20px;">Loading...</div>
    </div>

    <div class="footer">
      Metamorph Runtime v1.0.0
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
