[project]
name = "metamorph-scan"
version = "0.1.0"
description = "Full-platform web scanner -> dossier -> extension via Claude CLI skill"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44",
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "lxml>=5.2",
    "cssselect>=1.2",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scanner*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true